    <title>Nagrik Seva Kendra — Deeds & e-Registry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // No-flash theme/lang init: apply persisted choice (or OS preference)
      // before first paint so CSS variables resolve correctly.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("nsk-ui") || "{}").state || {};
          var theme =
            saved.theme ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var lang = saved.lang || "en";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-lang", lang);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
