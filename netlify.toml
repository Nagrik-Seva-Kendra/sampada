[build]
  command = "npx --yes pnpm@11.9.0 install --frozen-lockfile && npx --yes pnpm@11.9.0 --filter @sampada/shared build && npx --yes pnpm@11.9.0 --filter @sampada/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.16.0"

# Client-side routing (TanStack Router) — let the SPA handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
