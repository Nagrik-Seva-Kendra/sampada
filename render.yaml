services:
  - type: web
    name: sampada-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npx --yes pnpm@11.9.0 install --frozen-lockfile && npx --yes pnpm@11.9.0 --filter @sampada/shared build && npx --yes pnpm@11.9.0 --filter @sampada/api bundle
    startCommand: node apps/api/deploy/server.cjs
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: UPLOAD_DIR
        value: /data/guideline
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
